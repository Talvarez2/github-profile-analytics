<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Analytics</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>GitHub Profile Analytics</h1>
    <div class="search-bar">
      <input type="text" id="username-input" placeholder="Enter GitHub username" />
      <button id="search-btn">Analyze</button>
    </div>
  </header>
  <main id="dashboard" class="hidden">
    <section id="user-card"></section>
    <section id="repo-charts" class="chart-grid"></section>
    <section id="activity-section"></section>
  </main>
  <div id="loading" class="hidden">Loading...</div>
  <div id="error" class="hidden"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
