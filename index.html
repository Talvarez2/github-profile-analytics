<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Analytics</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>GitHub Profile Analytics</h1>
    <div class="search-bar">
      <input type="text" id="username" placeholder="Enter GitHub username" />
      <button id="analyze-btn">Analyze</button>
      <label class="compare-toggle">
        <input type="checkbox" id="compare-mode" /> Compare Mode
      </label>
      <input type="text" id="username2" placeholder="Second username" class="hidden" />
    </div>
  </header>
  <main id="dashboard" class="dashboard"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
